[package]
name = "folio-desktop"
version = "0.1.0"
description = "folio desktop host (Tauri, ADR-0006)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Export to PDF prints the webview straight to a file (ADR-0025):
# the same webkit2gtk/gtk that tauri already links, named directly.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"

[lib]
name = "folio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
