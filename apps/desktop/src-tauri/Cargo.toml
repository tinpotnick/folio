[package]
name = "folio-desktop"
version = "0.1.1"
description = "folio desktop host (Tauri, ADR-0006)"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# File dialogs: GTK's own by default; the desktop's file-chooser
# portal in the Flatpak (feature "flatpak"), where the sandbox only
# sees the files the user picks.
tauri-plugin-dialog = { version = "2", default-features = false }
tauri-plugin-opener = "2"

# Export to PDF prints the webview straight to a file (ADR-0025):
# the same webkit2gtk/gtk that tauri already links, named directly.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"

[features]
default = ["dialogs-gtk"]
dialogs-gtk = ["tauri-plugin-dialog/gtk3"]
flatpak = ["tauri-plugin-dialog/xdg-portal"]

[lib]
name = "folio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
