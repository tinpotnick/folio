[package]
name = "folio-desktop"
version = "0.1.0"
description = "folio desktop host (Tauri, ADR-0006)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[lib]
name = "folio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
