<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>folio — document-first workspace</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #fafbfc;
      }
      header {
        border-bottom: 1px solid #e6e8eb;
        padding: 10px 24px;
        display: flex;
        gap: 16px;
        align-items: center;
        background: #fff;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      header h1 {
        font-size: 18px;
        margin: 0;
        font-weight: 700;
      }
      header .tag {
        color: #57606a;
        font-size: 13px;
      }
      .toolbar {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .seg {
        display: flex;
        border: 1px solid #d0d7de;
        border-radius: 999px;
        padding: 3px;
        background: #fff;
      }
      .seg button {
        border: none;
        background: transparent;
        border-radius: 999px;
        width: 34px;
        height: 28px;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: #57606a;
      }
      .seg button:hover {
        background: #f3f4f6;
      }
      .seg button.active {
        background: #1f2328;
        color: #fff;
      }
      .seg svg {
        width: 16px;
        height: 16px;
      }
      .fmt {
        display: flex;
        gap: 2px;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 3px;
        background: #fff;
      }
      .fmt button {
        border: none;
        background: transparent;
        border-radius: 6px;
        min-width: 30px;
        height: 28px;
        font-size: 14px;
        cursor: pointer;
        color: #1f2328;
        font-family: inherit;
      }
      .fmt button:hover {
        background: #f3f4f6;
      }
      .fmt button.md:active,
      .fmt button:active {
        background: #e6e8eb;
      }
      button.plain {
        border: 1px solid #d0d7de;
        background: #fff;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
      }
      button.plain:hover {
        background: #f3f4f6;
      }
      main {
        padding: 24px;
      }
      .editor {
        width: 100%;
        min-height: 60vh;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 14px;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 16px;
        box-sizing: border-box;
        background: #fff;
        line-height: 1.5;
      }
      folio-doc[hidden] {
        display: none;
      }
      #status {
        position: fixed;
        bottom: 12px;
        right: 12px;
        background: #1f2328;
        color: #fff;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 20;
      }
      #status.show {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>folio</h1>
      <span class="tag">document-first workspace</span>
      <div class="toolbar">
        <div class="fmt" id="fmt-bar">
          <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
          <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
          <button data-cmd="code" title="Code">&#9003;</button>
        </div>
        <div class="seg" id="view-switch">
          <button id="btn-view" class="active" title="Document view">
            <svg
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <rect x="2.5" y="1.5" width="11" height="13" rx="1.5" />
              <path d="M5 5h6M5 8h6M5 11h4" stroke-linecap="round" />
            </svg>
          </button>
          <button id="btn-markdown" title="Markdown source">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path
                d="M2 12V4h2l2 2.5L8 4h2v8H8V7.5L6 10 4 7.5V12H2zm11.5 0L10 8h2V4h2v4h2l-2.5 4z"
              />
            </svg>
          </button>
        </div>
        <button id="btn-download" class="plain">Download .md</button>
      </div>
    </header>
    <main>
      <folio-doc id="the-doc"></folio-doc>
      <textarea id="editor" class="editor" hidden></textarea>
    </main>
    <div id="status">Saved</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
