<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>folio — document-first workspace</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #fafbfc;
      }
      header {
        border-bottom: 1px solid #e6e8eb;
        padding: 10px 24px;
        display: flex;
        gap: 16px;
        align-items: center;
        background: #fff;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      header h1 {
        font-size: 18px;
        margin: 0;
        font-weight: 700;
      }
      header .tag {
        color: #57606a;
        font-size: 13px;
      }
      .toolbar {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .seg {
        display: flex;
        border: 1px solid #d0d7de;
        border-radius: 999px;
        padding: 3px;
        background: #fff;
      }
      .seg button {
        border: none;
        background: transparent;
        border-radius: 999px;
        width: 34px;
        height: 28px;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: #57606a;
      }
      .seg button:hover {
        background: #f3f4f6;
      }
      .seg button.active {
        background: #1f2328;
        color: #fff;
      }
      .seg svg {
        width: 16px;
        height: 16px;
      }
      .fmt {
        display: flex;
        gap: 2px;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 3px;
        background: #fff;
      }
      .fmt button {
        border: none;
        background: transparent;
        border-radius: 6px;
        min-width: 30px;
        height: 28px;
        font-size: 14px;
        cursor: pointer;
        color: #1f2328;
        font-family: inherit;
      }
      .fmt button:hover {
        background: #f3f4f6;
      }
      .fmt button.md:active,
      .fmt button:active {
        background: #e6e8eb;
      }
      button.plain {
        border: 1px solid #d0d7de;
        background: #fff;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
      }
      button.plain:hover {
        background: #f3f4f6;
      }
      .layout {
        display: flex;
        min-height: calc(100vh - 52px);
      }
      #sidebar {
        position: sticky;
        top: 52px;
        align-self: flex-start;
        width: 230px;
        flex: none;
        border-right: 1px solid #e6e8eb;
        background: #fff;
        height: calc(100vh - 52px);
        overflow-y: auto;
        padding: 14px 8px 24px 14px;
        box-sizing: border-box;
      }
      #sidebar[hidden] {
        display: none;
      }
      #sidebar h2 {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #57606a;
        margin: 0 0 8px 6px;
      }
      #outline {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      #outline button {
        border: none;
        background: transparent;
        text-align: left;
        font: inherit;
        font-size: 13px;
        color: #1f2328;
        padding: 4px 8px;
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #outline button:hover {
        background: #f3f4f6;
      }
      #outline button.active {
        background: #e7ecff;
        color: #1f3fbf;
        font-weight: 600;
      }
      #outline .l1 {
        font-weight: 650;
      }
      #outline .l2 {
        padding-left: 20px;
      }
      #outline .l3,
      #outline .l4,
      #outline .l5,
      #outline .l6 {
        padding-left: 32px;
        color: #57606a;
      }
      main {
        padding: 24px;
        flex: 1;
        min-width: 0;
      }
      /* --- Markdown source editor: highlighted overlay --- */
      .md-wrap {
        position: relative;
        display: grid;
        grid-template-columns: auto 1fr;
        min-height: calc(100vh - 100px);
      }
      .md-wrap[hidden] {
        display: none;
      }
      .md-gutter {
        user-select: none;
        text-align: right;
        color: #b0b8c1;
        padding: 24px 10px 40vh 0;
        white-space: pre;
        line-height: 1.6;
      }
      .md-code {
        position: relative;
        overflow: hidden;
        border-radius: 0 8px 8px 0;
        padding-right: 16px;
      }
      #editor,
      .md-view {
        grid-row: 1;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 14px;
        line-height: 1.6;
        tab-size: 2;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        margin: 0;
        padding: 24px 0 40vh 2px;
        border: none;
        background: transparent;
        color: #1f2328;
      }
      #editor {
        grid-column: 2;
        position: relative;
        resize: none;
        outline: none;
        color: transparent;
        caret-color: #1f2328;
        z-index: 2;
        width: 100%;
      }
      #editor::selection {
        background: rgba(76, 110, 245, 0.25);
      }
      .md-view {
        grid-column: 2;
        z-index: 1;
      }
      .md-view .ln {
        display: block;
        min-height: 1.6em;
      }
      .tk-frontmatter-delim {
        color: #8250df;
        font-weight: 600;
      }
      .tk-frontmatter-key {
        color: #953800;
      }
      .tk-heading {
        color: #0550ae;
        font-weight: 650;
      }
      .tk-bullet {
        color: #116329;
      }
      .tk-bold {
        color: #1f2328;
        font-weight: 650;
      }
      .tk-italic {
        color: #1f2328;
        font-style: italic;
      }
      .tk-code {
        color: #cf222e;
      }
      .tk-directive {
        color: #8250df;
        font-weight: 600;
      }
      .tk-directive-key {
        color: #0550ae;
      }
      .tk-directive-list {
        color: #116329;
      }
      .tk-text {
        color: #1f2328;
      }
      folio-doc[hidden] {
        display: none;
      }
      #status {
        position: fixed;
        bottom: 12px;
        right: 12px;
        background: #1f2328;
        color: #fff;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 20;
      }
      #status.show {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>folio</h1>
      <span class="tag">document-first workspace</span>
      <div class="toolbar">
        <div class="fmt" id="block-bar">
          <button data-block="h1" title="Heading 1">H1</button>
          <button data-block="h2" title="Heading 2">H2</button>
          <button data-block="p" title="Paragraph">P</button>
        </div>
        <div class="fmt" id="fmt-bar">
          <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
          <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
          <button data-cmd="code" title="Code">&#9003;</button>
        </div>
        <button id="btn-table" class="plain" title="Insert a table">+ Table</button>
        <button id="btn-sidebar" class="plain" title="Toggle the section browser">☰ Sections</button>
        <div class="seg" id="view-switch">
          <button id="btn-view" class="active" title="Document view">
            <svg
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <rect x="2.5" y="1.5" width="11" height="13" rx="1.5" />
              <path d="M5 5h6M5 8h6M5 11h4" stroke-linecap="round" />
            </svg>
          </button>
          <button id="btn-markdown" title="Markdown source">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path
                d="M2 12V4h2l2 2.5L8 4h2v8H8V7.5L6 10 4 7.5V12H2zm11.5 0L10 8h2V4h2v4h2l-2.5 4z"
              />
            </svg>
          </button>
        </div>
        <button id="btn-open" class="plain" hidden title="Open a .md file">Open…</button>
        <button id="btn-save" class="plain" hidden title="Save to a .md file">Save…</button>
        <button id="btn-download" class="plain">Download .md</button>
      </div>
    </header>
    <div class="layout">
      <nav id="sidebar" aria-label="Section browser">
        <h2>Sections</h2>
        <div id="outline"></div>
      </nav>
      <main>
        <folio-doc id="the-doc"></folio-doc>
        <div class="md-wrap" id="md-wrap" hidden>
          <div class="md-gutter" id="md-gutter" aria-hidden="true"></div>
          <pre class="md-view" id="md-view" aria-hidden="true"></pre
          ><textarea id="editor" class="editor" spellcheck="false"></textarea>
        </div>
      </main>
    </div>
    <div id="status">Saved</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
