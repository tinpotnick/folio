# folio as a Flatpak (docs/specs/releases.md). Built from source and
# offline: every npm package and Rust crate is listed in the
# generated *-sources.json files (regenerate them when the lockfiles
# change: see packaging/flatpak/README.md).
id: io.github.tinpotnick.folio
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: folio
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Playing sound (charts' music, sheet music) and recording audio.
  - --socket=pulseaudio
  # Optional, by consent only: the Strudel player add-on and the
  # online sample banks a pattern names. Documents render offline.
  - --share=network
  # Files come and go through the desktop's file-chooser portal: no
  # filesystem access beyond what the user picks.
modules:
  - name: folio
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
      env:
        CARGO_HOME: /run/build/folio/cargo
        CARGO_NET_OFFLINE: "true"
        npm_config_cache: /run/build/folio/flatpak-node/npm-cache
        npm_config_offline: "true"
        XDG_CACHE_HOME: /run/build/folio/flatpak-node/cache
    build-commands:
      - npm ci --offline --no-audit --no-fund
      # The web layer, then the desktop shell around it (no bundling:
      # Flatpak is the package).
      - npx tauri build --no-bundle --features flatpak -- --no-default-features --offline
      - install -Dm755 apps/desktop/src-tauri/target/release/folio /app/bin/folio
      - install -Dm644 packaging/linux/io.github.tinpotnick.folio.desktop /app/share/applications/io.github.tinpotnick.folio.desktop
      - install -Dm644 packaging/linux/io.github.tinpotnick.folio.metainfo.xml /app/share/metainfo/io.github.tinpotnick.folio.metainfo.xml
      - install -Dm644 docs/media/icon.svg /app/share/icons/hicolor/scalable/apps/io.github.tinpotnick.folio.svg
      - install -Dm644 apps/desktop/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.tinpotnick.folio.png
      - install -Dm644 apps/desktop/src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.tinpotnick.folio.png
    sources:
      # Local builds use this checkout; the Flathub copy of this file
      # pins a release tag and commit instead (README.md).
      - type: dir
        path: ../..
        skip:
          - node_modules
          - dist
          - apps/desktop/src-tauri/target
          - .flatpak-builder
          - packaging/flatpak/build
          - packaging/flatpak/repo
      - node-sources.json
      - cargo-sources.json
