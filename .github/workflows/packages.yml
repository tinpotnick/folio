name: packages

# folio's own package repositories, on GitHub Pages
# (docs/specs/package-repos.md):
#   https://tinpotnick.github.io/folio/repo/   flatpak/  rpm/  apt/
#
# Publishing a release adds its Flatpak bundle, .rpm and .deb to the
# repositories, signed with the repository key, keeps them on the
# `pkg-repo` branch and redeploys the site. A pull request touching
# this does a dry run (from the latest release) and keeps the result
# as an artifact.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.1)"
        required: true
  pull_request:
    paths:
      - "packaging/repo/**"
      - ".github/workflows/packages.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: packages
  cancel-in-progress: false

env:
  BASE: https://tinpotnick.github.io/folio/repo
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Which release
        id: rel
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          [ -n "$tag" ] || tag=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree createrepo-c rpm apt-utils

      - name: Signing key
        if: github.event_name != 'pull_request'
        run: printf '%s' "${{ secrets.PKG_GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Throwaway key (dry run)
        if: github.event_name == 'pull_request'
        run: |
          gpg --batch --passphrase '' --quick-gen-key "folio dry run <dry@run>" rsa2048 sign 0
          gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}' > /tmp/fpr

      - name: The release's files
        run: |
          mkdir -p assets built
          tag=${{ steps.rel.outputs.tag }}
          repo=${{ github.repository }}
          # From the tag's build runs, not the release: a release
          # download is how folio counts installs (docs/specs/package-repos.md).
          run=$(gh run list --workflow release.yml --branch "$tag" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$run" ] && gh run download "$run" -n folio-ubuntu-22.04 -D built || true
          find built \( -name '*.rpm' -o -name '*.deb' \) -exec cp {} assets/ \;
          run=$(gh run list --workflow flatpak.yml --branch "$tag" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$run" ] && gh run download "$run" -n folio-x86_64.flatpak -D assets || true
          # Old tags whose build artifacts have expired: the release.
          compgen -G 'assets/*.deb' >/dev/null || gh release download "$tag" -p '*.deb' -D assets
          compgen -G 'assets/*.rpm' >/dev/null || gh release download "$tag" -p '*.rpm' -D assets
          compgen -G 'assets/*.flatpak' >/dev/null || gh release download "$tag" -p '*.flatpak' -D assets || true
          # The release already carries folio's signed .rpm (an earlier
          # publish of this tag)? Then use that one as it is - signing
          # again would change its bytes, and its checksum.
          labels=$(gh api "repos/$repo/releases/tags/$tag" --jq '[.assets[] | select(.name|endswith(".rpm")) | .label] | join(" ")')
          if [[ "$labels" == *"(signed)"* ]]; then
            rm -f assets/*.rpm
            gh release download "$tag" -p '*.rpm' -D assets
            touch assets/.rpm-signed
          fi
          # The Flatpak bundle goes on the release when it is published.
          if [ "${{ github.event_name }}" != pull_request ] && compgen -G 'assets/*.flatpak' >/dev/null; then
            gh api "repos/$repo/releases/tags/$tag" --jq '.assets[].name' | grep -qx folio.flatpak \
              || gh release upload "$tag" assets/folio.flatpak
          fi
          ls -la assets

      - name: The repositories so far
        run: |
          if git ls-remote --exit-code --heads origin pkg-repo >/dev/null; then
            git fetch --depth 1 origin pkg-repo
            mkdir site && git archive FETCH_HEAD | tar -x -C site
          else
            mkdir site
          fi

      - name: Publish into the repositories
        run: |
          fpr="${{ secrets.PKG_GPG_FINGERPRINT }}"
          [ "${{ github.event_name }}" = pull_request ] && fpr=$(cat /tmp/fpr)
          packaging/repo/publish.sh site assets "$fpr" "$BASE" "${{ steps.rel.outputs.tag }}"

      # What GNOME Software does for most users: a SYSTEM installation
      # adds the repository and pulls its catalogue (it writes as root,
      # so it rejects objects a user installation accepts). Nothing is
      # published unless this works.
      - name: Check a system installation can use it
        run: |
          fpr="${{ secrets.PKG_GPG_FINGERPRINT }}"
          [ "${{ github.event_name }}" = pull_request ] && fpr=$(cat /tmp/fpr)
          gpg --export "$fpr" > /tmp/repo-key.gpg
          sudo flatpak remote-add --system --gpg-import=/tmp/repo-key.gpg \
            folio-check "file://$PWD/site/flatpak"
          sudo flatpak update --system --appstream folio-check
          sudo flatpak remote-ls --system folio-check
          sudo flatpak remote-delete --system folio-check

      - name: Keep the result (dry run)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: package-repos-dry-run
          path: site
          retention-days: 7

      # dnf fetches the .rpm from the release (so installs count): the
      # release must carry the signed package the repository describes.
      - name: Put the signed .rpm on the release
        if: github.event_name != 'pull_request'
        run: |
          [ -f assets/.rpm-signed ] && exit 0
          for f in assets/signed-rpm/*.rpm; do
            gh release upload "${{ steps.rel.outputs.tag }}" "$f#$(basename "$f") (signed)" --clobber
          done

      - name: Save to the pkg-repo branch
        if: github.event_name != 'pull_request'
        run: |
          cd site
          git init -q -b pkg-repo
          git config user.name "folio packages"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Package repositories: ${{ steps.rel.outputs.tag }}"
          # One commit, no history: the repositories themselves keep
          # the versions they need.
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pkg-repo

      - name: Redeploy the site
        if: github.event_name != 'pull_request'
        run: gh workflow run pages.yml --ref main
