name: flatpak

# Builds the Flatpak exactly as Flathub will (offline, from the
# generated sources) in Flathub's own build image. Runs when the
# desktop app or its packaging changes, and on release tags. It keeps
# the resulting .flatpak bundle as an artifact, and on a release tag
# attaches it to the release too (until folio is on Flathub, this is
# how a Linux user installs the Flatpak):
#   flatpak install --user folio.flatpak

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packaging/**"
      - "package-lock.json"
      - ".github/workflows/flatpak.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: folio.flatpak
          manifest-path: packaging/flatpak/io.github.tinpotnick.folio.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.json') }}
      - name: Attach the bundle to the release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: folio.flatpak
